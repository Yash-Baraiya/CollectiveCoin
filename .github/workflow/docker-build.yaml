name: Docker build
on:
  push:
    branches:
      - Collectivecoin

jobs:
  docker-build: 
      runs-on : ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: setup docker build
          uses: docker/setup-buildx-action@v3

        - name: building backend
          uses: docker/build-push-action@v6
          with:
            context: ./backend
            file: ./backend/Dockerfile
            push: false
            tags: collectivecoin-backend:latest

        - name: building frontend
          uses: docker/build-push-action@v6
          with:
            context: ./frontend/collectivecoin
            file: ./frontend/collectivecoin/Dockerfile
            push: false
            tags: collectivecoin-frontend:latest
