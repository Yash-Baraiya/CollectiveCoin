name: Docker build
on:
  push:
    branches:
      - CollectiveCoin

jobs:
  docker-build: 
      runs-on : ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: setup docker build
          uses: docker/setup-buildx-action@v3

        - name: building backend
          uses: docker/build-push-action@v6
          with:
            context: ./Backend
            file: ./Backend/Dockerfile
            push: false
            tags: collectivecoin-backend:latest

        - name: building frontend
          uses: docker/build-push-action@v6
          with:
            context: ./Frontend/CollectiveCoin
            file: ./Frontend/CollectiveCoin/Dockerfile
            push: false
            tags: collectivecoin-frontend:latest
